; =====================================================================
; MUST PV18-3024 VPM II  ->  ESP32-S3  ->  MQTT  ->  Home Assistant
; =====================================================================
;
; Подключение к инвертору -- только RS485 (USB Host выпилен из проекта:
; на обычном ESP32-S3-DevKitC-1 нативный OTG-порт физически не подаёт
; VBUS/+5В на устройство, из-за чего USB Host принципиально не мог
; заработать без доработки платы -- см. историю решений в README).
;
; ВАЖНО про размер flash / разделы:
;   Настроено под ВАШУ конкретную плату: ESP32-S3-DevKitC-1 N16R8
;   (16MB flash QIO + 8MB PSRAM OPI). Если позже смените плату на другой
;   вариант памяти -- поправьте блок "Точная память вашей платы" ниже.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- Точная память вашей платы: ESP32-S3-DevKitC-1 N16R8 ----
; N16 = 16MB flash, Quad SPI (QIO)
; R8  = 8MB PSRAM, Octal SPI (OPI)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM

; ElegantOTA тянет ESPAsyncWebServer/AsyncTCP как транзитивную зависимость
; (поддержка обоих режимов -- sync/async), но мы используем только
; синхронный WebServer. Явно запрещаем сборку неиспользуемых либ.
lib_ignore =
    ESPAsyncWebServer
    AsyncTCP

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    4-20ma/ModbusMaster @ ^2.0.1
    ayushsharma82/ElegantOTA @ ^3.1.1
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit SHT4x Library @ ^1.0.5

; ElegantOTA работает в синхронном режиме (обычный WebServer),
; никаких доп. флагов не требуется -- это дефолт библиотеки.
